<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nsdcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nsdcOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
    <linearGradient id="nsdcBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="nsdcGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="250" cy="250" r="230" fill="url(#nsdcGlow)" />

  <!-- Outer Ring with notches -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#EA580C" stroke-width="6" stroke-dasharray="14 10" opacity="0.4" />
  <circle cx="250" cy="250" r="200" fill="#FFFFFF" stroke="#EA580C" stroke-width="8" filter="drop-shadow(0 8px 16px rgba(234, 88, 12, 0.15))" />

  <!-- Inner Decorative Ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#1E3A8A" stroke-width="3" />
  <circle cx="250" cy="250" r="140" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <!-- Skill India / NSDC Emblem Elements -->
  <!-- Hands holding growth / sun -->
  <!-- Orange rising rays -->
  <g id="rays" opacity="0.9">
    <path d="M250 160 L250 135" stroke="#EA580C" stroke-width="7" stroke-linecap="round" />
    <path d="M220 170 L200 150" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />
    <path d="M280 170 L300 150" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />
    <path d="M195 195 L175 185" stroke="#EA580C" stroke-width="5" stroke-linecap="round" />
    <path d="M305 195 L325 185" stroke="#EA580C" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Sun / Star Center -->
  <circle cx="250" cy="190" r="22" fill="url(#nsdcOrange)" />
  <circle cx="250" cy="190" r="15" fill="#FFFFFF" opacity="0.3" />

  <!-- Supporting Tricolor Hands / Arcs -->
  <!-- Left Wing / Hand (Orange) -->
  <path d="M170 260 C175 220, 215 205, 238 215 C220 228, 205 245, 200 275 C190 270, 180 265, 170 260 Z" fill="url(#nsdcOrange)" />
  
  <!-- Right Wing / Hand (Green) -->
  <path d="M330 260 C325 220, 285 205, 262 215 C280 228, 295 245, 300 275 C310 270, 320 265, 330 260 Z" fill="url(#nsdcGreen)" />

  <!-- Central Base (Blue) -->
  <path d="M210 270 C235 255, 265 255, 290 270 C280 288, 265 295, 250 295 C235 295, 220 288, 210 270 Z" fill="url(#nsdcBlue)" />

  <!-- Center Gear Element -->
  <circle cx="250" cy="275" r="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="250" cy="275" r="5" fill="#EA580C" />

  <!-- Bold Typography -->
  <!-- Top Arc Text: SKILL INDIA -->
  <text x="250" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#EA580C" text-anchor="middle" letter-spacing="3">
    SKILL INDIA
  </text>
  
  <text x="250" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="2">
    कौशल भारत • कुशल भारत
  </text>

  <!-- Bottom Brand Text: NSDC -->
  <text x="250" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="4">
    NSDC
  </text>
  
  <text x="250" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#64748B" text-anchor="middle" letter-spacing="1.5">
    NATIONAL SKILL DEVELOPMENT
  </text>

  <text x="250" y="394" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle" letter-spacing="1">
    GOVERNMENT OF INDIA PARTNER
  </text>
</svg>
